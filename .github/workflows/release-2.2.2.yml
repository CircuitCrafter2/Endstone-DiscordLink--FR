name: Release DiscordLink 2.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-2.2.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.2 >/dev/null 2>&1; then
            echo "Release v2.2.2 already exists"
            exit 0
          fi
          gh release create v2.2.2 dist/* --target "$GITHUB_SHA" --title "DiscordLink v2.2.2" --notes "DiscordLink 2.2.2 for Endstone. Includes Discord Components V2 verification, automatic role synchronization, configurable panel/success colors, optional Minecraft character thumbnails, and integrations for StonePerms, PurePerms, Factions/zFactions, and BedrockEconomy."
