name: Update and release DiscordLink 2.2.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-release-2.2.3.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("pyproject.toml", 'version = "2.2.2"', 'version = "2.2.3"')

          p = Path("src/endstone_discordlink/__init__.py")
          text = p.read_text(encoding="utf-8")
          if '__version__ = "2.2.2"' in text:
              text = text.replace('__version__ = "2.2.2"', '__version__ = "2.2.3"')
          elif '__version__' not in text:
              text = text.rstrip() + '\n\n__version__ = "2.2.3"\n'
          p.write_text(text, encoding="utf-8")

          replace("src/endstone_discordlink/discord_api.py", '"User-Agent": "EndstoneDiscordLink/2.2.1 (+https://endstone.dev)",', '"User-Agent": "EndstoneDiscordLink/2.2.3 (+https://endstone.dev)",')
          replace(
              "src/endstone_discordlink/discord_api.py",
              '''    def send_components_message(self, channel_id: str, components: list[dict]) -> dict:\n        return self._request(\n            "POST",\n            f"/channels/{channel_id}/messages",\n            {"flags": 32768, "components": components},\n        )\n\n''',
              '''    def send_components_message(self, channel_id: str, components: list[dict]) -> dict:\n        return self._request(\n            "POST",\n            f"/channels/{channel_id}/messages",\n            {"flags": 32768, "components": components},\n        )\n\n    def send_dm_message(self, user_id: str, content: str) -> dict:\n        channel = self._request("POST", "/users/@me/channels", {"recipient_id": user_id})\n        channel_id = str(channel.get("id", "")).strip()\n        if not channel_id:\n            raise DiscordApiError(0, "Discord did not return a DM channel")\n        return self._request("POST", f"/channels/{channel_id}/messages", {"content": content})\n\n''',
          )

          replace("src/endstone_discordlink/discord_gateway.py", "EndstoneDiscordLink/2.2.1", "EndstoneDiscordLink/2.2.3")
          replace("src/endstone_discordlink/plugin.py", 'version = "2.2.1"', 'version = "2.2.3"')
          replace(
              "src/endstone_discordlink/plugin.py",
              '''        player_name = player.name\n        player.send_message(f"{PREFIX} §bChecking Discord ID…")\n\n        def job() -> None:\n            if self.settings.require_guild_membership:\n                self.discord.get_member(discord_id)\n\n        def done(_result, error: Exception | None) -> None:\n            online = self._online_player(player_uuid, player_name)\n            if error is not None:\n                self.storage.cancel_pending(player_uuid)\n                if online is not None:\n                    if isinstance(error, DiscordApiError) and error.status == 404:\n                        online.send_message(f"{PREFIX} §cThat Discord account is not in the configured Discord server.")\n                    else:\n                        online.send_message(f"{PREFIX} §cDiscord could not validate that account. Please try again or contact staff.")\n                self.logger.warning(f"Discord account validation failed for {player_name}: {error}")\n                return\n            if online is None:\n                return\n            self.refresh_profile(online)\n            self.forms.show_code(online, code)\n\n        self._submit(job, done)\n''',
              '''        player_name = player.name\n        dm_enabled = bool(self.ui_value("dm", "enabled", True))\n        dm_content = self._verification_dm_content(player_name, code)\n        player.send_message(f"{PREFIX} §bChecking Discord ID…")\n\n        def job():\n            if self.settings.require_guild_membership or dm_enabled:\n                self.discord.get_member(discord_id)\n            dm_error = None\n            dm_sent = False\n            if dm_enabled:\n                try:\n                    self.discord.send_dm_message(discord_id, dm_content)\n                    dm_sent = True\n                except Exception as exc:\n                    dm_error = exc\n            return dm_sent, dm_error\n\n        def done(result, error: Exception | None) -> None:\n            online = self._online_player(player_uuid, player_name)\n            if error is not None:\n                self.storage.cancel_pending(player_uuid)\n                if online is not None:\n                    if isinstance(error, DiscordApiError) and error.status == 404:\n                        online.send_message(f"{PREFIX} §cThat Discord account is not in the configured Discord server.")\n                    else:\n                        online.send_message(f"{PREFIX} §cDiscord could not validate that account. Please try again or contact staff.")\n                self.logger.warning(f"Discord account validation failed for {player_name}: {error}")\n                return\n            if online is None:\n                return\n            dm_sent, dm_error = result if isinstance(result, tuple) else (False, None)\n            if dm_enabled and dm_sent:\n                online.send_message(f"{PREFIX} §aVerification code sent to your Discord DMs.")\n            elif dm_enabled and dm_error is not None:\n                online.send_message(f"{PREFIX} §eI couldn't DM you. §7Use the code shown here instead.")\n                self.logger.info(f"Could not DM verification code to {discord_id} for {player_name}: {dm_error}")\n            self.refresh_profile(online)\n            self.forms.show_code(online, code)\n\n        self._submit(job, done)\n''',
          )
          replace(
              "src/endstone_discordlink/plugin.py",
              '''    def send_link_status(self, player: Player) -> None:\n''',
              '''    def _verification_dm_content(self, player_name: str, code: str) -> str:\n        expiry_minutes = max(1, (self.settings.expiry_seconds + 59) // 60)\n        values = {\n            "player": player_name,\n            "code": code,\n            "server_name": self.settings.server_name,\n            "expiry_minutes": str(expiry_minutes),\n        }\n        title = str(self.ui_value("dm", "title", "## 🔐 DiscordLink Verification"))\n        description = str(self.ui_value("dm", "description", "A Minecraft account link was requested for **{player}** on **{server_name}**."))\n        expiry = str(self.ui_value("dm", "expiry", "Expires in **{expiry_minutes} minutes**."))\n        footer = str(self.ui_value("dm", "footer", "-# If you did not request this, ignore this message."))\n        parts = [title, description, f"```text\\n{code}\\n```", expiry, footer]\n        return "\\n\\n".join(_format_text(part, values) for part in parts if part.strip())\n\n    def send_link_status(self, player: Player) -> None:\n''',
          )
          replace(
              "src/endstone_discordlink/plugin.py",
              '''def _code(length: int) -> str:\n    return "".join(secrets.choice(string.digits) for _ in range(length))\n''',
              '''def _format_text(value: str, values: dict[str, str]) -> str:\n    try:\n        return value.format_map(values)\n    except (KeyError, ValueError):\n        return value\n\n\ndef _code(length: int) -> str:\n    return "".join(secrets.choice(string.digits) for _ in range(length))\n''',
          )

          replace(
              "src/endstone_discordlink/config.toml",
              '''[ui.verify_modal]\ntitle = "Verify Minecraft Account"\nlabel = "6-digit code"\ndescription = "Enter the code shown in Minecraft after using /link."\n\n''',
              '''[ui.dm]\nenabled = true\ntitle = "## 🔐 DiscordLink Verification"\ndescription = "A Minecraft account link was requested for **{player}** on **{server_name}**."\nexpiry = "Expires in **{expiry_minutes} minutes**."\nfooter = "-# If you did not request this, ignore this message."\n\n[ui.verify_modal]\ntitle = "Verify Minecraft Account"\nlabel = "6-digit code"\ndescription = "Enter the 6-digit code from your Discord DM or the code shown in Minecraft."\n\n''',
          )

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("version-2.2.2-8B5CF6", "version-2.2.3-8B5CF6")
          text = text.replace(
              "| ⏱️ Temporary Codes | Configurable expiry, retry limits and request cooldowns. |",
              "| ⏱️ Temporary Codes | Configurable expiry, retry limits and request cooldowns. |\n| 📩 Discord DM Delivery | Confirms the Discord user is in the configured server, then attempts to DM the code in a copyable block with an in-game fallback if DMs are closed. |",
          )
          text = text.replace(
              "3. Minecraft displays a temporary six-digit code.\n4. Player opens the Discord verification channel.\n5. Player taps **Verify** or runs `/verify` and enters the code.",
              "3. DiscordLink confirms the Discord account is a member of the configured Discord server.\n4. The bot attempts to DM the six-digit code in a copyable code block; Minecraft still shows the code as a fallback if DMs are closed.\n5. Player opens the Discord verification channel and taps **Verify** or runs `/verify` to enter the code.",
          )
          text = text.replace(
              "- Guild membership requirement.\n- Automatic role-sync interval.",
              "- Guild membership requirement.\n- Discord DM verification-code delivery and customizable DM text.\n- Automatic role-sync interval.",
          )
          p.write_text(text, encoding="utf-8")
          PY
      - name: Verify source
        run: |
          python -m compileall -q src
          python - <<'PY'
          import ast
          import io
          import pathlib
          import tokenize
          root = pathlib.Path("src/endstone_discordlink")
          comments = []
          docstrings = []
          for path in root.glob("*.py"):
              source = path.read_text(encoding="utf-8")
              for token in tokenize.generate_tokens(io.StringIO(source).readline):
                  if token.type == tokenize.COMMENT:
                      comments.append((path.name, token.start[0]))
              tree = ast.parse(source)
              if ast.get_docstring(tree):
                  docstrings.append((path.name, "module"))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and ast.get_docstring(node):
                      docstrings.append((path.name, getattr(node, "name", "?")))
          if comments or docstrings:
              raise SystemExit(f"Source cleanliness failed: comments={comments}, docstrings={docstrings}")
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml src/endstone_discordlink
          git commit -m "Add Discord DM verification codes"
          git push origin HEAD:main
      - name: Build release
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          gh release create v2.2.3 dist/* --target "$COMMIT" --title "DiscordLink v2.2.3" --notes "DiscordLink 2.2.3 adds Discord membership validation and optional DM delivery of verification codes in a clean copyable block. The in-game code remains available as a fallback when DMs are closed. Also keeps automatic role sync, Components V2 verification, and supported plugin integrations."
