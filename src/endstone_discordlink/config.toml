[server]
name = "KyroMC"
discord_invite = "https://discord.gg/yourserver"

[discord]
bot_token = ""
guild_id = ""
verification_channel_id = ""
require_guild_membership = true
restrict_to_verification_channel = true
gateway_enabled = true
register_commands = true

[security]
code_length = 6
expiry_seconds = 600
max_attempts = 5
cooldown_seconds = 60
allow_relink = false

[integrations]
stoneperms = true
pureperms = true
factions = true
bedrockeconomy = true

[role_sync]
verified_role_id = ""
remove_managed_roles = true
sync_interval_seconds = 60

[role_sync.groups]
# default = "123456789012345678"
# vip = "123456789012345679"
# mvp = "123456789012345680"
# moderator = "123456789012345681"
# admin = "123456789012345682"

[role_sync.faction_ranks]
# leader = "123456789012345683"
# officer = "123456789012345684"
# member = "123456789012345685"

[role_sync.factions]
# Kyro = "123456789012345686"

# [[role_sync.economy_tiers]]
# min_balance = 10000
# max_balance = 99999
# role_id = "123456789012345687"

# [[role_sync.economy_tiers]]
# min_balance = 100000
# role_id = "123456789012345688"

[ui.panel]
embed_color = "#5865F2"
title = "## 🔗 Lien de compte Minecraft"
description = "Lie ton compte Minecraft à Discord en moins d'une minute."
instructions = """**1.** Exécute `/link` dans Minecraft
**2.** Entre ton ID Discord
**3.** Appuie sur **Vérifier** et entre le code à 6 chiffres"""
footer = "-# Les codes sont temporaires et liés au compte Discord saisi dans Minecraft."
thumbnail_url = ""
verify_button = "Vérifier"
unlink_button = "Délier"

[ui.dm]
enabled = true
title = "## 🔐 Vérification DiscordLink"
description = "Un lien de compte Minecraft a été demandé pour **{player}** sur **{server_name}**."
expiry = "Expire dans **{expiry_minutes} minutes**."
footer = "-# Si tu n'as pas demandé cela, ignore ce message."

[ui.verify_modal]
title = "Vérifier le compte Minecraft"
label = "Code à 6 chiffres"
description = "Entre le code à 6 chiffres reçu dans tes messages privés Discord ou affiché dans Minecraft."

[ui.success]
embed_color = "#57F287"
show_player_character = true
title = "## ✅ Compte lié"
linking_body = "## ✅ Code accepté\nLiaison de ton compte et synchronisation des rôles Discord…"
hide_empty_fields = true
fields = [
    "Minecraft|`{player}`",
    "Discord|{discord_mention}",
    "Groupe|`{group}`",
    "Faction|`{faction}`",
    "Rang dans la faction|`{faction_rank}`",
    "Solde|`{balance}`",
    "XUID|`{xuid}`",
    "Vérifié|{verified_timestamp}"
]
sync_line = "{role_sync_status}"
footer = "-# Les rôles Discord sont synchronisés automatiquement pendant que tu joues."
thumbnail_url = "https://api.mcheads.org/head/.{player_url}/128"
unlink_button = "Délier"

[ui.unlink]
embed_color = "#FEE75C"
confirm_body = "## 🔓 Délier le compte ?\nDélier **{player}** de {discord_mention} ?"
confirm_button = "Délier"
cancel_button = "Annuler"
success_body = "## ✅ Compte délié\n**{player}** n'est plus lié. Les rôles gérés sont en cours de suppression."

[ui.error]
embed_color = "#ED4245"

[ui.neutral]
embed_color = "#5865F2"

[ui.commands]
verify_description = "Vérifie et lie ton compte Minecraft"
unlink_description = "Délie ton compte Minecraft"
panel_description = "Envoyer le panneau de vérification DiscordLink"

[ui.minecraft_link]
title = "§l§9Lien Discord"
content = "§fLie ton compte Minecraft à Discord.\n\n§71. Appuie sur §aLier Discord\n§72. Entre ton ID Discord\n§73. Entre le code à 6 chiffres dans Discord\n\n§b{discord_invite}"
link_button = "§a§lLIER DISCORD\n§r§7Générer un code"
close_button = "§8Fermer"

[ui.minecraft_linked]
title = "§l§9Lien Discord"
content = "§a§l✓ LIÉ§r\n§7Tes rôles Discord se synchronisent automatiquement."
sync_button = "§eRafraîchir les rôles\n§7Uniquement nécessaire si quelque chose semble incorrect"
unlink_button = "§cDélier Discord\n§7Supprimer ce lien de compte"
close_button = "§8Fermer"

[ui.minecraft_id]
title = "ID Discord"
label = "Ton ID utilisateur Discord"
placeholder = "123456789012345678"
submit_button = "Créer un code"

[ui.minecraft_code]
title = "§l§aCode de vérification"
content = "§7Entre ce code dans le salon de vérification Discord :\n\n§l§e{code}§r\n\n§7Expire dans §f{expiry_minutes} min§7. Appuie sur §aVérifier §7ou utilise §f/verify §7dans Discord."
done_button = "§aTerminé"
close_button = "§8Fermer"
chat_message = "§9§lDiscordLink§r §8»§r §fCode §e§l{code}§r §8• §7Entre-le dans Discord."

[ui.minecraft_unlink]
title = "Délier Discord ?"
content = "§7Cela supprime le lien de compte et les rôles gérés par DiscordLink."
confirm_button = "§cDélier"
cancel_button = "§8Annuler"

[ui.minecraft_admin]
title = "§l§9Admin DiscordLink"
content = "§7Liens §f{links}  §8•  §7En attente §f{pending}\n§7Bot §f{gateway}\n\n{integrations}"
panel_button = "§dEnvoyer le panneau de vérification\n§7Publier le panneau Discord V2"
sync_button = "§bSynchroniser les joueurs en ligne\n§7Rafraîchir les rôles Discord gérés"
reload_button = "§eRecharger la configuration"
links_button = "§fComptes liés"
links_title = "Comptes liés"
back_button = "Retour"
close_button = "§8Fermer"
