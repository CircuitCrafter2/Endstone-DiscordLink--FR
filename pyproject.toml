[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-discordlink"
version = "2.2.3.postfr"
description = "Liaison de compte et synchronisation des rôles Discord Components V2 pour Endstone"
requires-python = ">=3.11"
authors = [{name = "KyroMC"}, {name = "CircuitCrafter"}]
license = {text = "MIT"}
keywords = ["endstone", "minecraft", "bedrock", "discord", "verification", "link"]

[project.entry-points."endstone"]
discordlink = "endstone_discordlink:DiscordLinkPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_discordlink = ["config.toml"]
